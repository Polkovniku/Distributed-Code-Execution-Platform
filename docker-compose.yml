services:
  db:
    image: postgres:16
    container_name: distributed_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - distributed_code_db:/var/lib/postgresql/data


  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: distributed_rabbitmq
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - distributed_code_rabbitmq:/var/lib/rabbitmq

  worker:
    build: ./worker
    container_name: distributed_worker
    env_file:
      - .env
    depends_on:
      - db
      - rabbitmq
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  
  service:
    build: ./app-service
    container_name: distributed_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - rabbitmq
    
volumes:
  distributed_code_db:
  distributed_code_rabbitmq:
