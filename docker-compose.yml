services:
  db:
    image: postgres:16
    container_name: distributed_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - distributed_code_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      retries: 5


  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: distributed_rabbitmq
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - distributed_code_rabbitmq:/var/lib/rabbitmq

  worker:
    build: ./worker
    container_name: distributed_worker
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  
  beat:
    build: ./worker
    container_name: distributed_beat
    command: uv run celery -A core.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - rabbitmq
  
  service:
    build: ./app-service
    container_name: distributed_api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    command: sh -c "uv run alembic upgrade head && uv run uvicorn main:app --host 0.0.0.0 --port 8000"
  
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: distributed_nginx
    ports:
      - "80:80"
    depends_on:
      - service

  test-db:
    image: postgres:16
    container_name: distributed_test_db
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: petrovich
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    profiles:
      - test
    
volumes:
  distributed_code_db:
  distributed_code_rabbitmq:
