<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Code Runner</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Запуск кода</h1>
    <div class="card">
      <div id="authBlock">
        <h2>Вход</h2>
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Пароль">
        <input id="username" type="text" placeholder="Логин (для регистрации)">
        <button id="loginBtn">Войти</button>
        <button id="registerBtn">Регистрация</button>
        <span id="authStatus"></span>
      </div>

      <div id="appBlock" style="display:none">
        <select id="language">
          <option value="python">Python</option>
          <option value="python">JavaScript</option>
        </select>
        <textarea id="code" placeholder="print('Hello, world')"></textarea>
        <button id="runBtn">Запустить</button>
        <h3>Результат:</h3>
        <pre id="output">—</pre>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/anyword-hint.min.js"></script>

  <script src="keywords.js"></script>
  <script src="common.js"></script>
  <script src="auth.js"></script>
  <script src="jobs.js"></script>
</body>
</html>
