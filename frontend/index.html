<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Code Runner</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <h1 id="appHeading">Code Runner</h1>
      </div>
      <div class="language-switcher">
        <label id="interfaceLanguageLabel" for="uiLanguage">Interface language</label>
        <select id="uiLanguage">
          <option value="en">English</option>
          <option value="uk">Українська</option>
        </select>
      </div>
    </div>
    <div class="card">
      <div id="authBlock">
        <h2 id="authHeading">Sign in</h2>
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <input id="username" type="text" placeholder="Username (for registration)">
        <button id="loginBtn">Sign in</button>
        <button id="registerBtn">Register</button>
        <span id="authStatus"></span>
      </div>

      <div id="appBlock" style="display:none">
        <label id="languageLabel" for="language">Programming language</label>
        <select id="language">
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="c++">C++</option>
          <option value="go">Go</option>
          <option value="java">Java</option>
          <option value="rust">Rust</option>
        </select>
        <textarea id="code" placeholder="print('Hello, world')"></textarea>
        <button id="runBtn">Run</button>
        <h3 id="resultHeading">Result</h3>
        <pre id="output">—</pre>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/go/go.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/rust/rust.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/anyword-hint.min.js"></script>

  <script src="keywords.js"></script>
  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script src="auth.js"></script>
  <script src="jobs.js"></script>
</body>
</html>
